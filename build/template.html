<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>TAGLYZ Portfolio</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface-1:#fcfcfb;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
    --pos:#2a78d6; --negb:#d03b3b;
    --good:#006300; --critical:#d03b3b; --warning:#fab219;
    --hover:rgba(11,11,11,0.04);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --pos:#3987e5; --negb:#d03b3b;
    --good:#0ca30c; --critical:#d03b3b; --warning:#fab219;
    --hover:rgba(255,255,255,0.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 24px 64px; }
  [hidden] { display:none !important; }

  /* ---------- lock screen ---------- */
  #lock { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lockcard { background:var(--surface-1); border:1px solid var(--border); border-radius:16px;
    padding:34px 32px; width:100%; max-width:420px; }
  .lockcard h1 { font-size:19px; margin:0 0 6px; font-weight:640; letter-spacing:-0.01em; }
  .lockcard p { color:var(--text-secondary); font-size:13px; margin:0 0 20px; }
  .lockcard label { display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:6px; }
  .lockcard input { width:100%; padding:11px 13px; font:inherit; border-radius:10px;
    border:1px solid var(--axis); background:var(--page); color:var(--text-primary); }
  .lockcard input:focus { outline:2px solid var(--series-1); outline-offset:1px; border-color:transparent; }
  .lockcard button { margin-top:14px; width:100%; padding:11px; font:inherit; font-weight:600;
    border:0; border-radius:10px; background:var(--series-1); color:#fff; cursor:pointer; }
  .lockcard button:disabled { opacity:.55; cursor:default; }
  .err { color:var(--critical); font-size:12.5px; margin-top:12px; min-height:18px; }

  /* ---------- chrome ---------- */
  header.top { display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
    flex-wrap:wrap; margin-bottom:22px; }
  h1.title { font-size:22px; font-weight:650; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--text-secondary); font-size:13px; margin:0; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, .toggle { background:var(--surface-1); border:1px solid var(--border); color:var(--text-secondary);
    border-radius:999px; padding:8px 14px; font:inherit; font-size:12.5px; cursor:pointer; }
  select { border-radius:10px; }
  .toggle:hover, select:hover { color:var(--text-primary); }

  /* ---------- month chips ---------- */
  .monthrow { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 10px; }
  .mchip { font:inherit; font-size:12.5px; background:var(--surface-1); color:var(--text-secondary);
    border:1px solid var(--border); border-radius:999px; padding:6px 14px; cursor:pointer; }
  .mchip:hover { color:var(--text-primary); background:var(--hover); }
  .mchip[aria-pressed="true"] { background:var(--series-1); border-color:var(--series-1); color:#fff; }
  .mchip.inrange { border-color:var(--series-1); color:var(--text-primary); }
  .monthrow .sep { width:1px; height:20px; background:var(--grid); margin:0 5px; }
  .monthrow .hint { font-size:12px; color:var(--text-muted); margin-left:4px; }

  /* ---------- property filter ---------- */
  .filterrow { display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; margin:0 0 16px; }
  .filterwrap { position:relative; }
  .filterbtn { background:var(--surface-1); border:1px solid var(--border); color:var(--text-secondary);
    border-radius:10px; padding:8px 14px; font:inherit; font-size:12.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; }
  .filterbtn:hover { color:var(--text-primary); }
  .filterbtn.active { border-color:var(--series-2); color:var(--text-primary); }
  .filterbtn .caret { font-size:10px; color:var(--text-muted); }
  .filterpanel { position:absolute; z-index:30; top:calc(100% + 6px); left:0; width:290px;
    max-height:60vh; overflow-y:auto; background:var(--surface-1); border:1px solid var(--border);
    border-radius:12px; padding:10px; box-shadow:0 10px 30px rgba(0,0,0,.18); }
  .filterpanel .fhead { display:flex; gap:8px; padding:4px 6px 10px; border-bottom:1px solid var(--grid); margin-bottom:6px; }
  .filterpanel .fhead button { flex:1; background:transparent; border:1px solid var(--border);
    border-radius:8px; padding:6px; font:inherit; font-size:12px; color:var(--text-secondary); cursor:pointer; }
  .filterpanel .fhead button:hover { color:var(--text-primary); background:var(--hover); }
  .fgroup { font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;
    padding:10px 6px 4px; display:flex; justify-content:space-between; align-items:center; }
  .fgroup button { background:transparent; border:0; color:var(--text-muted); font:inherit;
    font-size:11px; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .fgroup button:hover { color:var(--text-primary); }
  .fitem { display:flex; align-items:center; gap:9px; padding:6px 6px; border-radius:8px;
    font-size:13px; cursor:pointer; }
  .fitem:hover { background:var(--hover); }
  .fitem input { accent-color:var(--series-1); width:15px; height:15px; cursor:pointer; flex:none; }
  .fitem.off { color:var(--text-muted); }
  .fitem input:disabled { cursor:default; opacity:.5; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chips .lbl { font-size:12.5px; color:var(--text-secondary); }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px;
    background:var(--surface-1); border:1px solid var(--border); border-left:3px solid var(--series-1);
    border-radius:999px; padding:4px 6px 4px 10px; color:var(--text-secondary); }
  .chip.out { border-left-color:var(--series-2); }
  .morebtn { background:transparent; border:0; color:var(--text-secondary); font:inherit;
    font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
    padding:4px 6px; border-radius:8px; }
  .morebtn:hover { color:var(--text-primary); background:var(--hover); }
  .chip button { background:transparent; border:0; color:var(--text-muted); cursor:pointer;
    font:inherit; font-size:14px; line-height:1; padding:0 3px; border-radius:50%; }
  .chip button:hover { color:var(--text-primary); background:var(--hover); }
  .emptystate { background:var(--surface-1); border:1px solid var(--border); border-radius:14px;
    padding:40px 24px; text-align:center; color:var(--text-secondary); }

  .hero { background:var(--surface-1); border:1px solid var(--border); border-radius:14px;
    padding:24px 26px; margin-bottom:16px; display:flex; align-items:flex-end; gap:40px; flex-wrap:wrap; }
  .hero .label { color:var(--text-secondary); font-size:13px; }
  .hero .value { font-size:52px; font-weight:640; letter-spacing:-0.025em; line-height:1.05; margin-top:2px; }
  .hero .heronote { color:var(--text-muted); font-size:12.5px; margin-top:6px; }
  .hero-side { display:flex; gap:34px; flex-wrap:wrap; padding-bottom:6px; }
  .hero-side .l { color:var(--text-secondary); font-size:12.5px; }
  .hero-side .v { font-size:20px; font-weight:600; letter-spacing:-0.01em; margin-top:2px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:22px; }
  .tile { background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .tile .l { color:var(--text-secondary); font-size:12.5px; }
  .tile .v { font-size:25px; font-weight:620; letter-spacing:-0.02em; margin-top:3px; }
  .tile .d { font-size:12px; color:var(--text-muted); margin-top:3px; }
  .pos { color:var(--good); } .neg { color:var(--critical); }

  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:14px;
    padding:22px 24px 18px; margin-bottom:16px; }
  .card h2 { font-size:15px; font-weight:620; margin:0 0 3px; }
  .card .cap { color:var(--text-secondary); font-size:12.5px; margin:0 0 16px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:880px){ .grid2{grid-template-columns:1fr;} .hero .value{font-size:42px;} }

  .legend { display:flex; gap:18px; flex-wrap:wrap; margin:0 0 10px; }
  .legend span { display:inline-flex; align-items:center; gap:7px; color:var(--text-secondary);
    font-size:12.5px; white-space:nowrap; }
  .key { width:11px; height:11px; border-radius:3px; display:inline-block; flex:none; }
  .key.line { height:3px; width:15px; border-radius:2px; }

  svg { display:block; width:100%; overflow:visible; }
  .tick { fill:var(--text-muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .xlab { fill:var(--text-secondary); font-size:11.5px; }
  .dlab { fill:var(--text-primary); font-size:11.5px; font-weight:600; }
  .dim { opacity:0.2; }
  :root[data-theme="dark"] .dim { opacity:0.26; }
  .xlab.on { fill:var(--text-primary); font-weight:650; }
  .gridline { stroke:var(--grid); stroke-width:1; }
  .baseline { stroke:var(--axis); stroke-width:1; }
  .rowhit { fill:transparent; cursor:pointer; }
  .rowhit:hover { fill:var(--hover); }

  .tip { position:fixed; pointer-events:none; z-index:40; opacity:0; transition:opacity .1s;
    background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:9px 11px;
    font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.14); min-width:158px; }
  .tip .t { font-weight:620; margin-bottom:5px; }
  .tip .r { display:flex; align-items:center; gap:10px; justify-content:space-between; color:var(--text-secondary); }
  .tip .r b { color:var(--text-primary); font-weight:600; font-variant-numeric:tabular-nums; }
  .tip .r .nm { display:inline-flex; align-items:center; gap:6px; }

  details.tablewrap { background:var(--surface-1); border:1px solid var(--border);
    border-radius:14px; padding:18px 24px; margin-bottom:16px; }
  details.tablewrap summary { cursor:pointer; font-weight:600; font-size:14px; }
  .scroller { overflow-x:auto; margin-top:14px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums; }
  th,td { padding:7px 10px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--grid); }
  th:first-child, td:first-child { text-align:left; font-variant-numeric:normal;
    position:sticky; left:0; background:var(--surface-1); }
  thead th { color:var(--text-secondary); font-weight:600; border-bottom:1px solid var(--axis); }
  tr.section td { color:var(--text-secondary); font-weight:600; padding-top:14px; }
  tr.total td { font-weight:640; border-top:1px solid var(--axis); }
  td.indent { padding-left:24px; color:var(--text-secondary); }
  tbody tr.clickable { cursor:pointer; }
  tbody tr.clickable:hover td { background:var(--hover); }

  .tabletools { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
  .dlbtn { background:var(--surface-1); border:1px solid var(--border); color:var(--text-secondary);
    border-radius:9px; padding:7px 13px; font:inherit; font-size:12.5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; }
  .dlbtn:hover { color:var(--text-primary); background:var(--hover); }
  .dlbtn.done { color:var(--good); border-color:var(--good); }

  .note { background:var(--surface-1); border:1px solid var(--border);
    border-left:3px solid var(--warning); border-radius:10px; padding:14px 18px;
    font-size:12.5px; color:var(--text-secondary); margin-bottom:16px; }
  .note b { color:var(--text-primary); }
  footer { color:var(--text-muted); font-size:12px; margin-top:22px; }
</style>
</head>
<body>

<div id="lock">
  <form class="lockcard" id="lockform">
    <h1>TAGLYZ Portfolio</h1>
    <p>This report is encrypted. Enter the passphrase to view it.</p>
    <label for="pw">Passphrase</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button type="submit" id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1 class="title" id="viewTitle">Portfolio</h1>
      <p class="sub" id="viewSub"></p>
    </div>
    <div class="controls">
      <select id="propSel" aria-label="Choose a view"></select>
      <button class="toggle" id="themeBtn" type="button">Dark mode</button>
    </div>
  </header>
  <div class="monthrow" id="monthRow" role="group" aria-label="Choose months"></div>
  <div class="filterrow" id="filterRow" hidden>
    <div class="filterwrap">
      <button class="filterbtn" id="filterBtn" type="button" aria-expanded="false" aria-controls="filterPanel">
        <span id="filterLabel">All properties</span><span class="caret">&#9662;</span>
      </button>
      <div class="filterpanel" id="filterPanel" hidden role="group" aria-label="Choose properties to include"></div>
    </div>
    <div class="chips" id="filterChips"></div>
  </div>
  <div id="body"></div>
  <footer id="foot"></footer>
</div>

<div class="tip" id="tip"></div>

<script>
"use strict";
const BLOB = "__PAYLOAD__";
const META = __META__;

/* ============================ decryption ============================ */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pass) {
  const raw = b64(BLOB);
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), body = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
    "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: META.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, body);
  return JSON.parse(new TextDecoder().decode(plain));
}

const form = document.getElementById("lockform");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("unlock"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Decrypting…"; err.textContent = "";
  try {
    P = await decrypt(document.getElementById("pw").value);
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    boot();
  } catch (_) {
    err.textContent = "That passphrase didn't work.";
    btn.disabled = false; btn.textContent = "Unlock";
    document.getElementById("pw").select();
  }
});

/* ============================ helpers ============================ */
let P = null;
const NS = "http://www.w3.org/2000/svg";
const sum = a => a.reduce((x, y) => x + y, 0);
const money = v => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
const money2 = v => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const compact = v => {
  if (Math.abs(v) < 1000) return money(v);
  const k = (Math.abs(v) / 1000).toFixed(Math.abs(v) < 10000 ? 1 : 0).replace(/\.0$/, "");
  return (v < 0 ? "-$" : "$") + k + "k";
};
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function niceTicks(max, maxTicks) {
  if (max <= 0) return [0, 1];
  const mag = Math.pow(10, Math.floor(Math.log10(max)) - 1);
  let step = mag;
  for (const s of [1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500]) {
    step = s * mag;
    if (Math.ceil(max / step) + 1 <= maxTicks) break;
  }
  const out = []; let v = 0;
  while (v < max - 1e-9) { out.push(v); v += step; }
  out.push(v);
  return out;
}
function colPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, Math.max(h, 0));
  if (h <= 0.5) return `M${x} ${y + h} h${w}`;
  return `M${x} ${y + h} V${y + r} a${r} ${r} 0 0 1 ${r} ${-r} h${w - 2 * r} a${r} ${r} 0 0 1 ${r} ${r} V${y + h} Z`;
}

const tip = document.getElementById("tip");
function showTip(html, evt) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const pad = 14, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = x + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
const tipRow = (c, n, v) => `<div class="r"><span class="nm"><i class="key" style="background:${c}"></i>${n}</span><b>${v}</b></div>`;
function attachTip(node, build) {
  node.addEventListener("mousemove", e => showTip(build(), e));
  node.addEventListener("mouseleave", hideTip);
  node.addEventListener("focus", () => {
    const b = node.getBoundingClientRect();
    showTip(build(), { clientX: b.left + b.width / 2, clientY: b.top });
  });
  node.addEventListener("blur", hideTip);
  node.setAttribute("tabindex", "0");
}

/* ============================ data shaping ============================ */
const GROUP_OF = {};
function initGroups() {
  for (const g in P.groups) for (const lab of P.groups[g]) GROUP_OF[lab] = g;
}
const GROUP_NAMES = ["Taxes & insurance", "Repairs & handyman", "Utilities", "Management & admin"];
const GROUP_VAR = ["--series-1", "--series-2", "--series-3", "--series-4"];

/* ---- view model ----
   A portfolio view is a SET of properties. "All properties" is just the set of
   everything; an entity preset is that entity's members; a saved group is a set
   the viewer named. Single-property views ignore the set entirely - excluding a
   property from the roll-up does not hide its own page. */
const VIEW = { type: "portfolio", label: "Portfolio", include: null };  // include:null = all
const allProps = () => Object.keys(P.properties);
const includedProps = () =>
  VIEW.include ? allProps().filter(p => VIEW.include.has(p)) : allProps();
const isFiltered = () => !!VIEW.include && VIEW.include.size < allProps().length;

/* Saved groups live in this viewer's browser only. They survive the monthly
   rebuild (nothing about them is baked into the page) but they do not follow the
   viewer to another device, and another viewer sees their own. Sharing a group
   means sharing the URL, which encodes the selection. */
/* ---- month selection ----
   [start, end] inclusive indices into P.months; start===end is a single month.
   Charts keep every month and dim what is outside this window; every NUMBER -
   headline, tiles, rankings, table, CSV - covers only the selection. */
let MSEL = null;                       // set once P is known
const mAll = () => [0, P.months.length - 1];
const mFiltered = () => MSEL && (MSEL[0] !== 0 || MSEL[1] !== P.months.length - 1);
const mLabel = () => MSEL[0] === MSEL[1]
  ? `${P.months[MSEL[0]]} ${P.year}`
  : `${P.months[MSEL[0]]}\u2013${P.months[MSEL[1]]} ${P.year}`;

const GKEY = "taglyz.groups.v1";
function loadGroups() {
  try { return JSON.parse(localStorage.getItem(GKEY)) || []; } catch (_) { return []; }
}
function saveGroups(g) {
  try { localStorage.setItem(GKEY, JSON.stringify(g)); return true; } catch (_) { return false; }
}
let GROUPS = [];

/* A "series" is the shape every chart consumes, for one property or the whole portfolio. */
function seriesFor(name) {
  const n = P.months.length;
  const zeros = () => new Array(n).fill(0);
  const s = {
    name, months: P.months,
    income: zeros(), expenses: zeros(), expensesRecorded: zeros(),
    noi: zeros(), debt: zeros(), capex: zeros(), cashflow: zeros(), variance: zeros(),
    rent: zeros(), lines: {}, groups: {}
  };
  GROUP_NAMES.forEach(g => s.groups[g] = zeros());
  const list = name === "__ALL__" ? includedProps() : [name];
  for (const prop of list) {
    const months = P.properties[prop];
    for (let i = 0; i < n; i++) {
      const m = months[i];
      s.income[i] += m.totalIncome; s.expenses[i] += m.totalExpenses;
      s.expensesRecorded[i] += m.totalExpensesRecorded;
      s.noi[i] += m.noi; s.debt[i] += m.debt; s.capex[i] += m.capex;
      s.cashflow[i] += m.cashflow; s.variance[i] += m.variance;
      s.rent[i] += (m.income["Rental Income"] || 0);
      for (const lab in m.expenses) {
        (s.lines[lab] = s.lines[lab] || zeros())[i] += m.expenses[lab];
        const g = GROUP_OF[lab.toLowerCase()];
        if (g) s.groups[g][i] += m.expenses[lab];
      }
      for (const lab in m.income) (s.lines["+" + lab] = s.lines["+" + lab] || zeros())[i] += m.income[lab];
    }
  }
  // Full-length arrays stay intact for the charts; every total respects MSEL.
  const [a, b] = MSEL || [0, n - 1];
  s.range = () => [a, b];
  s.nMonths = () => b - a + 1;
  s.selMonths = () => s.months.slice(a, b + 1);
  s.slice = k => s[k].slice(a, b + 1);
  s.ytd = k => Math.round(sum(s.slice(k)) * 100) / 100;
  return s;
}

/* ============================ charts ============================ */
function chartIncomeExpense(svg, s) {
  svg.innerHTML = "";
  const W = 520, H = 300, m = { t: 14, r: 14, b: 34, l: 56 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const ticks = niceTicks(Math.max(...s.income, ...s.expenses), 8), top = ticks[ticks.length - 1];
  const y = v => m.t + ph - (v / top) * ph;
  ticks.forEach(t => {
    el("line", { x1: m.l, x2: m.l + pw, y1: y(t), y2: y(t), class: t === 0 ? "baseline" : "gridline" }, svg);
    el("text", { x: m.l - 9, y: y(t) + 4, class: "tick", "text-anchor": "end" }, svg).textContent = compact(t);
  });
  const [ra, rb] = s.range();
  const band = pw / s.months.length, gap = 2, bw = Math.min(24, (band - 16 - gap) / 2);
  s.months.forEach((mo, i) => {
    const cx = m.l + band * i + band / 2, x0 = cx - bw - gap / 2;
    const on = i >= ra && i <= rb;
    const g = el("g", { class: on ? "" : "dim" }, svg);
    [["income", "--series-1", x0], ["expenses", "--series-2", x0 + bw + gap]].forEach(([k, cv, x]) => {
      const v = s[k][i];
      el("path", { d: colPath(x, y(v), bw, (v / top) * ph, 4), fill: cssv(cv) }, g);
    });
    el("text", { x: cx, y: H - m.b + 18, class: "xlab" + (on && mFiltered() ? " on" : "") }, svg).textContent = mo;
    // Click a column to focus that month (and again to clear) - the chart doubles
    // as a shortcut for the chip row above it.
    const hit = el("rect", { x: m.l + band * i, y: m.t, width: band, height: ph,
      fill: "transparent", style: "cursor:pointer" }, svg);
    attachTip(hit, () => `<div class="t">${mo}</div>`
      + tipRow(cssv("--series-1"), "Income", money2(s.income[i]))
      + tipRow(cssv("--series-2"), "Expenses", money2(s.expenses[i]))
      + tipRow("transparent", "NOI", money2(s.noi[i]))
      + `<div class="r" style="margin-top:5px"><span class="nm">Click to focus ${mo}</span></div>`);
    hit.addEventListener("click", () => setMonths(ra === i && rb === i ? mAll() : [i, i]));
  });
}

function chartNoiCash(svg, s) {
  svg.innerHTML = "";
  const W = 520, H = 300, m = { t: 20, r: 58, b: 34, l: 58 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const all = s.noi.concat(s.cashflow);
  const lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const span = hi - lo || 1;
  const step = niceTicks(span, 6)[1] || 1;
  const tlo = Math.floor(lo / step) * step, thi = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = tlo; v <= thi + step * 0.001; v += step) ticks.push(v);
  const y = v => m.t + ph - ((v - tlo) / (thi - tlo)) * ph;
  const x = i => m.l + (pw / (s.months.length - 1)) * i;
  ticks.forEach(t => {
    el("line", { x1: m.l, x2: m.l + pw, y1: y(t), y2: y(t), class: Math.abs(t) < 1e-9 ? "baseline" : "gridline" }, svg);
    el("text", { x: m.l - 9, y: y(t) + 4, class: "tick", "text-anchor": "end" }, svg).textContent = compact(t);
  });
  s.months.forEach((mo, i) => el("text", { x: x(i), y: H - m.b + 18, class: "xlab", "text-anchor": "middle" }, svg).textContent = mo);
  const [ra, rb] = s.range();
  const ser = [["noi", "--series-1"], ["cashflow", "--series-2"]];

  ser.forEach(([k, cv]) => {

        "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", class: "dim" }, svg);

      "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  });
  ser.forEach(([k, cv]) => s[k].forEach((v, i) => {
    const on = i >= ra && i <= rb;
    el("circle", { cx: x(i), cy: y(v), r: on ? 4 : 3, fill: cssv(cv),
      stroke: cssv("--surface-1"), "stroke-width": 2, class: on ? "" : "dim" }, svg);
  }));
  el("text", { x: x(rb) + 10, y: y(s.noi[rb]) + 4, class: "dlab" }, svg).textContent = compact(s.noi[rb]);
  el("text", { x: x(rb) + 10, y: y(s.cashflow[rb]) + 4, class: "dlab" }, svg).textContent = compact(s.cashflow[rb]);
  s.months.forEach((mo, i) => {

    const hit = el("rect", { x: Math.max(m.l - 4, x(i) - bw / 2), y: m.t - 10, width: bw, height: ph + 20, fill: "transparent", style: "cursor:crosshair" }, svg);
    let line = null;
    hit.addEventListener("mouseenter", () => { line = el("line", { x1: x(i), x2: x(i), y1: m.t - 6, y2: m.t + ph, stroke: cssv("--axis"), "stroke-width": 1 }, svg); });

function chartExpenseBars(svg, s) {

  el("line", { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, class: "baseline" }, svg);
  cats.forEach(([name, val], i) => {
    const yTop = m.t + i * rowH, bh = 15, by = yTop + (rowH - bh) / 2, w = (val / max) * pw;

      `M${m.l} ${by} H${m.l + w - r} a${r} ${r} 0 0 1 ${r} ${r} v${bh - 2 * r} a${r} ${r} 0 0 1 ${-r} ${r} H${m.l} Z`;
    el("path", { d, fill: c }, svg);

/* Diverging horizontal bars: YTD cash flow after debt, by property. */
function chartRanking(svg, rows, onPick) {
  svg.innerHTML = "";
  const W = 1040, m = { t: 8, r: 24, b: 8, l: 176 }, rowH = 30;
  const H = m.t + rows.length * rowH + m.b;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  // Value labels sit outside the bar ends, so reserve a gutter on each side wide
  // enough for the longest one. Without it the largest negative bar runs its
  // label straight into the property-name column.
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.value))) || 1;
  const gutter = Math.max(56, money(-maxAbs).length * 7.2);
  const barLeft = m.l + gutter, barRight = W - m.r - gutter;
  const half = (barRight - barLeft) / 2, zero = barLeft + half;
  const posC = cssv("--pos"), negC = cssv("--negb");
  rows.forEach((r, i) => {
    const yTop = m.t + i * rowH, bh = 15, by = yTop + (rowH - bh) / 2;
    const w = Math.abs(r.value) / maxAbs * half;
    const positive = r.value >= 0;
    const x = positive ? zero : zero - w;
    const rad = Math.min(4, w / 2);
    const hit = el("rect", { x: 0, y: yTop, width: W, height: rowH, class: "rowhit" }, svg);
    el("text", { x: m.l - 14, y: by + bh / 2 + 4, class: "xlab", "text-anchor": "end" }, svg).textContent = r.name;
    if (w > 0.5) {
      const d = positive
        ? `M${x} ${by} H${x + w - rad} a${rad} ${rad} 0 0 1 ${rad} ${rad} v${bh - 2 * rad} a${rad} ${rad} 0 0 1 ${-rad} ${rad} H${x} Z`
        : `M${x + w} ${by} H${x + rad} a${rad} ${rad} 0 0 0 ${-rad} ${rad} v${bh - 2 * rad} a${rad} ${rad} 0 0 0 ${rad} ${rad} H${x + w} Z`;
      el("path", { d, fill: positive ? posC : negC }, svg);
    }
    el("text", {
      x: positive ? x + w + 9 : x - 9, y: by + bh / 2 + 4, class: "dlab",
      "text-anchor": positive ? "start" : "end"
    }, svg).textContent = money(r.value);
    attachTip(hit, () => `<div class="t">${r.name}</div>`
      + tipRow(positive ? posC : negC, mFiltered() ? "Cash flow" : "Cash flow YTD", money2(r.value))
      + tipRow("transparent", "NOI", money2(r.noi))
      + tipRow("transparent", "Debt service", money2(r.debt))
      + tipRow("transparent", "NOI margin", r.margin)
      + `<div class="r" style="margin-top:5px"><span class="nm">Click to open</span></div>`);
    hit.addEventListener("click", () => onPick(r.name));
    hit.addEventListener("keydown", e => { if (e.key === "Enter") onPick(r.name); });
  });
  el("line", { x1: zero, x2: zero, y1: m.t, y2: H - m.b, class: "baseline" }, svg);
}

/* ============================ table ============================ */
function tableRows(s) {
  const incLabels = Object.keys(s.lines).filter(k => k[0] === "+");
  const [ra, rb] = s.range();
  const win = arr => sum(arr.slice(ra, rb + 1));
  const expLabels = Object.keys(s.lines).filter(k => k[0] !== "+")
    .filter(k => win(s.lines[k]) !== 0).sort((a, b) => win(s.lines[b]) - win(s.lines[a]));
  const rows = [["section", "Income"]];
  incLabels.forEach(k => rows.push(["item", k.slice(1), s.lines[k]]));
  rows.push(["total", "Total income", s.income], ["section", "Operating expenses"]);
  expLabels.forEach(k => rows.push(["item", k, s.lines[k]]));
  rows.push(["total", "Total operating expenses (as subtotaled)", s.expenses],
    ["section", ""], ["total", "Net operating income", s.noi],
    ["item", "Debt service", s.debt], ["total", "Cash flow after debt", s.cashflow]);
  if (win(s.capex) !== 0) rows.push(["item", "Capital improvements", s.capex]);
  return rows;
}

function tableFor(s) {
  const rows = tableRows(s);
  const [a, b] = s.range();
  const totalCol = mFiltered() ? (s.nMonths() === 1 ? "Total" : "Period") : "YTD";
  let h = "<thead><tr><th>Line</th>" + s.selMonths().map(m => `<th>${m}</th>`).join("") +
    `<th>${totalCol}</th></tr></thead><tbody>`;
  rows.forEach(r => {
    if (r[0] === "section") { h += `<tr class="section"><td colspan="${s.nMonths() + 2}">${esc(r[1])}</td></tr>`; return; }
    const vals = r[2].slice(a, b + 1);
    h += `<tr class="${r[0] === "total" ? "total" : ""}"><td class="${r[0] === "item" ? "indent" : ""}">${esc(r[1])}</td>`
      + vals.map(v => `<td>${money2(v)}</td>`).join("") + `<td>${money2(sum(vals))}</td></tr>`;
  });
  return `<div class="tabletools">
      <button type="button" class="dlbtn" data-download="csv">&#8595; Download CSV</button>
    </div>
    <div class="scroller"><table>${h}</tbody></table></div>`;
}

/* ---------- CSV export ----------
   Values go out as raw numbers, not the formatted strings in the table, so the
   file lands in a spreadsheet as numbers rather than text. The leading block
   records which slice of the portfolio this is - a CSV of a filtered view that
   does not say so is exactly the thing the on-screen chrome guards against. */
function csvEscape(v) {
  const t = String(v);
  return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function buildCSV(s, title) {
  const L = [];
  const inc = includedProps(), excluded = allProps().filter(p => !inc.includes(p));
  L.push(["TAGLYZ portfolio report"]);
  L.push(["View", title]);
  if (VIEW.type === "portfolio") {
    L.push(["Properties included", isFiltered() ? `${inc.length} of ${allProps().length}` : `all ${allProps().length}`]);
    L.push(["Included", inc.join("; ")]);
    if (excluded.length) L.push(["Excluded", excluded.join("; ")]);
  }
  L.push(["Period", s.nMonths() === 1 ? `${s.selMonths()[0]} ${P.year}`
    : `${s.selMonths()[0]}-${s.selMonths()[s.nMonths() - 1]} ${P.year}`]);
  if (mFiltered()) L.push(["Scope", `A month selection is active. This export covers ${s.nMonths()} of ${s.months.length} months in the source workbook.`]);
  L.push(["Source", META.source]);
  L.push(["Basis", "Accrual. Figures as reported in the source workbook."]);
  const variance = s.ytd("variance");
  if (Math.abs(variance) >= 1) {
    L.push(["Note", `The source workbook's expense subtotals omit an insurance amount recorded in the same column; ` +
      `${money2(variance)} in total. Counting it, operating expenses are ${money2(s.ytd("expensesRecorded"))}.`]);
  }
  L.push([]);
  const [ca, cb] = s.range();
  L.push(["Line", ...s.selMonths(), mFiltered() ? "Total" : "YTD"]);
  tableRows(s).forEach(r => {
    if (r[0] === "section") { if (r[1]) L.push([]), L.push([r[1]]); return; }
    const vals = r[2].slice(ca, cb + 1);
    L.push([r[1], ...vals.map(v => v.toFixed(2)), sum(vals).toFixed(2)]);
  });
  return L.map(row => row.map(csvEscape).join(",")).join("\r\n");
}

function downloadCSV(btn) {
  const s = VIEW.type === "portfolio" ? seriesFor("__ALL__") : seriesFor(VIEW.label);
  const title = (VIEW.type === "portfolio"
    ? VIEW.label + (isFiltered() ? ` (${includedProps().length} of ${allProps().length} properties)` : "")
    : VIEW.label) + (mFiltered() ? ` — ${mLabel()}` : "");
  const slug = (VIEW.label || "portfolio").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const sm = s.selMonths();
  const span = sm.length === 1 ? sm[0] : `${sm[0]}-${sm[sm.length - 1]}`;
  const name = `TAGLYZ-${slug}-${span}-${P.year}.csv`;
  // \uFEFF: without the BOM Excel reads the file as the local codepage and mangles
  // the non-ASCII characters in the note lines.
  const blob = new Blob(["\uFEFF" + buildCSV(s, title)], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  if (btn) {
    const was = btn.innerHTML;
    btn.innerHTML = "&#10003; " + name;
    btn.classList.add("done");
    setTimeout(() => { btn.innerHTML = was; btn.classList.remove("done"); }, 2600);
  }
}

/* ============================ views ============================ */
function kpiTiles(s) {
  const inc = s.ytd("income"), exp = s.ytd("expenses"), noi = s.ytd("noi");
  const debt = s.ytd("debt"), cash = s.ytd("cashflow"), capex = s.ytd("capex");
  const dscr = debt ? (noi / debt) : 0;
  const negMonths = s.slice("cashflow").filter(v => v < 0).length;
  const n = s.nMonths();
  return `<section class="tiles">
    <div class="tile"><div class="l">Total income</div><div class="v">${money(inc)}</div><div class="d">${money(s.ytd("rent"))} of it rent</div></div>
    <div class="tile"><div class="l">Operating expenses</div><div class="v">${money(exp)}</div><div class="d">${inc ? (exp / inc * 100).toFixed(1) : 0}% of income</div></div>
    <div class="tile"><div class="l">Debt service</div><div class="v">${money(debt)}</div><div class="d">${n === 1 ? "mortgage payments" : money(debt / n) + " a month avg"}</div></div>
    <div class="tile"><div class="l">Cash flow after debt</div><div class="v ${cash >= 0 ? "pos" : "neg"}">${money(cash)}</div><div class="d">${n === 1 ? (cash >= 0 ? "positive this month" : "negative this month") : negMonths + " of " + n + " months negative"}</div></div>
    <div class="tile"><div class="l">Debt service coverage</div><div class="v">${dscr.toFixed(2)}&times;</div><div class="d">NOI &divide; debt service</div></div>
    <div class="tile"><div class="l">Capital improvements</div><div class="v">${money(capex)}</div><div class="d">${capex ? "outside NOI" : "none booked"}</div></div>
  </section>`;
}

function heroFor(s, label) {
  const noi = s.ytd("noi"), inc = s.ytd("income");
  const [a] = s.range(), n = s.nMonths();
  const selNoi = s.slice("noi"), selM = s.selMonths();
  const best = selNoi.indexOf(Math.max(...selNoi)), worst = selNoi.indexOf(Math.min(...selNoi));
  const period = mFiltered() ? mLabel() : "year to date";
  const side = n === 1
    ? `<div><div class="l">Income</div><div class="v">${compact(inc)}</div></div>
       <div><div class="l">Operating expenses</div><div class="v">${compact(s.ytd("expenses"))}</div></div>
       <div><div class="l">Cash flow after debt</div><div class="v ${s.ytd("cashflow") >= 0 ? "pos" : "neg"}">${compact(s.ytd("cashflow"))}</div></div>`
    : `<div><div class="l">Best month</div><div class="v">${selM[best]} · ${compact(selNoi[best])}</div></div>
       <div><div class="l">Weakest month</div><div class="v">${selM[worst]} · ${compact(selNoi[worst])}</div></div>
       <div><div class="l">Monthly average</div><div class="v">${compact(noi / n)}</div></div>`;
  return `<section class="hero">
    <div>
      <div class="label">${label}${mFiltered() ? " · " : ", "}${period}</div>
      <div class="value">${money(noi)}</div>
      <div class="heronote">${inc ? (noi / inc * 100).toFixed(1) : 0}% NOI margin on ${money(inc)} of income · ${n} month${n === 1 ? "" : "s"}</div>
    </div>
    <div class="hero-side">${side}</div>
  </section>`;
}

const LEGEND_NC = `<div class="legend">
  <span><i class="key line" style="background:var(--series-1)"></i>Net operating income</span>
  <span><i class="key line" style="background:var(--series-2)"></i>Cash flow after debt</span></div>`;
const LEGEND_MIX = `<div class="legend">` + GROUP_NAMES.map((g, i) =>
  `<span><i class="key" style="background:var(--${GROUP_VAR[i].slice(2)})"></i>${g}</span>`).join("") + `</div>`;

function varianceNote(s) {
  const v = s.ytd("variance");
  if (Math.abs(v) < 1) return "";
  const [ra] = s.range();
  const bad = s.selMonths().filter((m, i) => Math.abs(s.variance[ra + i]) > 0.01);
  return `<div class="note"><b>A subtotal discrepancy in the source workbook.</b>
    The expense subtotal excludes an insurance amount that is recorded in the same column in
    <b>${bad.join(", ")}</b> — ${money2(v)} in total. Every figure here follows the workbook as reported.
    Counting those amounts, operating expenses are <b>${money2(s.ytd("expensesRecorded"))}</b>,
    NOI is <b>${money2(s.ytd("income") - s.ytd("expensesRecorded"))}</b> and cash flow after debt is
    <b>${money2(s.ytd("income") - s.ytd("expensesRecorded") - s.ytd("debt"))}</b>.</div>`;
}

function scopeLabel() {
  const n = includedProps().length;
  return isFiltered() ? `across the ${n} selected propert${n === 1 ? "y" : "ies"}` : "across all properties";
}
/* Charts keep every month on screen, so their captions say so explicitly - a dimmed
   column is easy to misread as "no data" rather than "outside your selection". */
const monthNote = () => mFiltered()
  ? ` ${mLabel()} highlighted; the rest of the year stays for context.` : "";

function renderPortfolio() {
  const props = includedProps();
  if (!props.length) {
    document.getElementById("viewTitle").textContent = VIEW.label;
    document.getElementById("viewSub").textContent = "No properties selected";
    document.getElementById("body").innerHTML =
      `<div class="emptystate">No properties selected. Pick at least one from the filter above.</div>`;
    return;
  }
  const s = seriesFor("__ALL__");
  const rows = props.map(name => {
    const p = seriesFor(name);
    const noi = p.ytd("noi"), inc = p.ytd("income");
    return { name, value: p.ytd("cashflow"), noi, debt: p.ytd("debt"),
      margin: (inc ? (noi / inc * 100).toFixed(1) : "0") + "%" };
  }).sort((a, b) => b.value - a.value);
  const winners = rows.filter(r => r.value >= 0).length;

  const total = allProps().length;
  const excluded = allProps().filter(p => !props.includes(p));
  document.getElementById("viewTitle").textContent = VIEW.label;
  document.getElementById("viewSub").textContent =
    (isFiltered() ? `${props.length} of ${total} properties` : `${total} properties`) +
    ` · ${mFiltered() ? mLabel() : P.months[0] + "\u2013" + P.throughMonth + " " + P.year} · accrual basis` +
    (excluded.length && excluded.length <= 4 ? ` · excluding ${excluded.join(", ")}` : "");

  document.getElementById("body").innerHTML =
    heroFor(s, "Portfolio net operating income") + kpiTiles(s) +
    `<div class="grid2">
      ${chartCard("Income vs. operating expenses", `Monthly, ${scopeLabel()}.${monthNote()}`, LEGEND_IE, "cIE", "0 0 520 300")}
      ${chartCard("NOI and cash flow after debt service", `Monthly, ${scopeLabel()}.${monthNote()}`, LEGEND_NC, "cNC", "0 0 520 300")}
    </div>` +
    chartCard("Cash flow after debt service, by property",
      `${mFiltered() ? mLabel() : "Year to date"}. ${winners} of ${props.length} ${isFiltered() ? "selected " : ""}properties are cash-flow positive after debt. Click any row to open it.`,
      `<div class="legend"><span><i class="key" style="background:var(--pos)"></i>Positive</span><span><i class="key" style="background:var(--negb)"></i>Negative</span></div>`,
      "cRank", "0 0 1040 400") +
    chartCard("Expense mix, month by month", `Recorded line items, grouped, ${scopeLabel()}.${monthNote()}`, LEGEND_MIX, "cMix", "0 0 1040 320") +
    chartCard("Operating spend by category", `${mFiltered() ? mLabel() : "Year-to-date"} totals ${scopeLabel()}.`, "", "cBars", "0 0 1040 400") +
    varianceNote(s) +
    `<details class="tablewrap"><summary>Table view — ${isFiltered() ? esc(VIEW.label) : "portfolio"}, full monthly detail</summary>${tableFor(s)}</details>`;

  chartIncomeExpense(document.getElementById("cIE"), s);
  chartNoiCash(document.getElementById("cNC"), s);
  chartRanking(document.getElementById("cRank"), rows, pick);
  chartExpenseMix(document.getElementById("cMix"), s);
  chartExpenseBars(document.getElementById("cBars"), s);
}

function renderProperty(name) {
  const s = seriesFor(name);
  const entity = Object.keys(P.entities).find(e => P.entities[e].includes(name)) || "";
  document.getElementById("viewTitle").textContent = name;
  document.getElementById("viewSub").textContent =
    `${entity ? entity + " · " : ""}${mFiltered() ? mLabel() : P.months[0] + "\u2013" + P.throughMonth + " " + P.year} · accrual basis`;

  document.getElementById("body").innerHTML =
    heroFor(s, "Net operating income") + kpiTiles(s) +
    `<div class="grid2">
      ${chartCard("Income vs. operating expenses", `Monthly, in dollars.${monthNote()}`, LEGEND_IE, "cIE", "0 0 520 300")}
      ${chartCard("NOI and cash flow after debt service", `Monthly. Cash flow is NOI less mortgage payments.${monthNote()}`, LEGEND_NC, "cNC", "0 0 520 300")}
    </div>` +
    chartCard("Where the operating spend went", `${mFiltered() ? mLabel() : "Year-to-date"} total by category, as recorded on each line.`, "", "cBars", "0 0 1040 400") +
    chartCard("Expense mix, month by month", "Fixed costs against the variable ones.", LEGEND_MIX, "cMix", "0 0 1040 320") +
    varianceNote(s) +
    `<details class="tablewrap"><summary>Table view — full monthly detail</summary>${tableFor(s)}</details>`;

  chartIncomeExpense(document.getElementById("cIE"), s);
  chartNoiCash(document.getElementById("cNC"), s);
  chartExpenseBars(document.getElementById("cBars"), s);
  chartExpenseMix(document.getElementById("cMix"), s);
}

/* ============================ filter UI ============================ */
const $ = id => document.getElementById(id);

/* ---- month chips ---- */
function setMonths(range) {
  MSEL = range;
  writeHash();
  renderMonths();
  draw();
}
function renderMonths() {
  const [a, b] = MSEL, last = P.months.length - 1;
  const all = !mFiltered();
  $("monthRow").innerHTML =
    `<button type="button" class="mchip" data-all="1" aria-pressed="${all}">Year to date</button>
     <span class="sep"></span>` +
    P.months.map((mo, i) => {
      const single = a === b && i === a;
      const inRange = !all && !single && i >= a && i <= b;
      return `<button type="button" class="mchip${inRange ? " inrange" : ""}" data-i="${i}"
        aria-pressed="${single}">${mo}</button>`;
    }).join("") +
    (all ? `<span class="hint">shift-click for a range</span>` : "");
}
$("monthRow").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.all) return setMonths(mAll());
  const i = +btn.dataset.i;
  if (e.shiftKey) {
    const anchor = MSEL[0];
    setMonths([Math.min(anchor, i), Math.max(anchor, i)]);
  } else {
    setMonths(MSEL[0] === i && MSEL[1] === i ? mAll() : [i, i]);
  }
});

function setInclude(set, label, type) {
  VIEW.include = set ? new Set(set) : null;
  VIEW.label = label;
  VIEW.type = type || "portfolio";
}

function entityOf(prop) {
  return Object.keys(P.entities).find(e => P.entities[e].includes(prop)) || "Other";
}
function propsByEntity() {
  const out = {};
  allProps().forEach(p => (out[entityOf(p)] = out[entityOf(p)] || []).push(p));
  return out;
}

function buildFilterPanel() {
  const inc = new Set(includedProps());
  const byEnt = propsByEntity();
  let h = `<div class="fhead">
      <button type="button" data-all="1">Select all</button>
      <button type="button" data-none="1">Clear all</button>
    </div>`;
  for (const ent in byEnt) {
    h += `<div class="fgroup"><span>${esc(ent)}</span><button type="button" data-ent="${esc(ent)}">only</button></div>`;
    h += byEnt[ent].map(p => {
      const on = inc.has(p);
      return `<label class="fitem ${on ? "" : "off"}">
        <input type="checkbox" data-prop="${esc(p)}" ${on ? "checked" : ""}>
        <span>${esc(p)}</span></label>`;
    }).join("");
  }
  h += `<div class="fhead" style="border-bottom:0;border-top:1px solid var(--grid);margin:8px 0 0;padding:10px 6px 2px">
      <button type="button" data-save="1">Save selection as a group…</button>
    </div>`;
  if (GROUPS.length) {
    h += `<div class="fgroup"><span>Saved groups</span></div>`;
    h += GROUPS.map(g => `<div class="fitem" style="justify-content:space-between">
        <span style="cursor:pointer" data-open="${esc(g.id)}">${esc(g.name)} <span style="color:var(--text-muted)">(${g.props.length})</span></span>
        <button type="button" data-del="${esc(g.id)}" style="background:transparent;border:0;color:var(--text-muted);cursor:pointer;font-size:15px">&times;</button>
      </div>`).join("");
  }
  $("filterPanel").innerHTML = h;
}

/* The chip row lists what is IN the current view - that is the thing a reader
   needs to know, and with 2 of 17 selected the inverse was a wall of 15 chips.
   Past CHIP_CAP the list collapses so a near-complete selection stays readable. */
const CHIP_CAP = 10;
let CHIPS_EXPANDED = false;

function updateFilterUI() {
  const inc = includedProps(), total = allProps().length;
  $("filterRow").hidden = VIEW.type === "property";
  $("filterLabel").textContent = isFiltered() ? `${inc.length} of ${total} properties` : `All ${total} properties`;
  $("filterBtn").classList.toggle("active", isFiltered());
  const chips = $("filterChips");
  if (!isFiltered()) { chips.innerHTML = ""; CHIPS_EXPANDED = false; return; }

  const shown = CHIPS_EXPANDED ? inc : inc.slice(0, CHIP_CAP);
  const only = inc.length === 1;   // the view must keep at least one property
  let h = `<span class="lbl">Showing:</span>` + shown.map(p =>
    `<span class="chip">${esc(p)}` +
    (only ? "" : `<button type="button" data-remove="${esc(p)}" aria-label="Remove ${esc(p)} from this view" title="Remove from this view">&times;</button>`) +
    `</span>`).join("");
  if (inc.length > CHIP_CAP) {
    h += `<button type="button" class="morebtn" data-more="1">` +
      (CHIPS_EXPANDED ? "show fewer" : `+${inc.length - CHIP_CAP} more`) + `</button>`;
  }
  const exN = total - inc.length;
  if (exN) h += `<button type="button" class="morebtn" data-addback="1" title="Open the filter to add properties back">${exN} excluded</button>`;
  chips.innerHTML = h;
}

function applySelection(set, label) {
  const arr = [...set];
  if (arr.length <= CHIP_CAP) CHIPS_EXPANDED = false;
  setInclude(arr.length === allProps().length ? null : arr, label || "Custom selection");
  writeHash();
  syncSelector();
  draw();
}

$("filterBtn").addEventListener("click", () => {
  const p = $("filterPanel"), open = p.hidden;
  if (open) buildFilterPanel();
  p.hidden = !open;
  $("filterBtn").setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => {
  if ($("filterPanel").hidden) return;
  // composedPath() is captured at dispatch, so this still reports the true origin
  // even when a handler upstream has already re-rendered the panel's contents
  // (e.target would by then be detached, and closest() would wrongly say "outside").
  if (e.composedPath().includes($("filterPanel")) || e.composedPath().includes($("filterBtn"))) return;
  $("filterPanel").hidden = true;
  $("filterBtn").setAttribute("aria-expanded", "false");
});
$("filterChips").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const d = btn.dataset;
  if (d.more) { CHIPS_EXPANDED = !CHIPS_EXPANDED; updateFilterUI(); return; }
  if (d.addback) {
    buildFilterPanel();
    $("filterPanel").hidden = false;
    $("filterBtn").setAttribute("aria-expanded", "true");
    return;
  }
  if (d.remove) {
    const set = new Set(includedProps());
    set.delete(d.remove);
    if (!set.size) return;                  // never leave the view empty
    applySelection(set);
  }
});
$("filterPanel").addEventListener("change", e => {
  const prop = e.target.dataset.prop;
  if (!prop) return;
  const set = new Set(includedProps());
  e.target.checked ? set.add(prop) : set.delete(prop);
  if (!set.size) { e.target.checked = true; return; }   // never leave the view empty
  applySelection(set);
  buildFilterPanel();
});
$("filterPanel").addEventListener("click", e => {
  const d = e.target.dataset;
  if (d.all) { applySelection(new Set(allProps()), "Portfolio"); buildFilterPanel(); }
  else if (d.none) { /* clearing everything would leave nothing to show */
    const first = allProps()[0];
    applySelection(new Set([first])); buildFilterPanel();
  }
  else if (d.ent) { applySelection(new Set(P.entities[d.ent] || []), d.ent); buildFilterPanel(); }
  else if (d.save) { saveCurrentAsGroup(); }
  else if (d.open) { const g = GROUPS.find(x => x.id === d.open); if (g) openGroup(g); }
  else if (d.del) {
    GROUPS = GROUPS.filter(x => x.id !== d.del); saveGroups(GROUPS);
    buildFilterPanel(); syncSelector();
  }
});

function saveCurrentAsGroup() {
  const props = includedProps();
  const name = (prompt("Name this group", VIEW.label === "Custom selection" ? "" : VIEW.label) || "").trim();
  if (!name) return;
  const existing = GROUPS.find(g => g.name.toLowerCase() === name.toLowerCase());
  if (existing) existing.props = props;
  else GROUPS.push({ id: "g" + Date.now().toString(36), name, props });
  if (!saveGroups(GROUPS)) {
    alert("This browser would not let me save the group, so it will not persist. The URL still holds the selection - bookmark it instead.");
  }
  VIEW.label = name;
  buildFilterPanel(); syncSelector(); writeHash(); draw();
}
function openGroup(g) {
  const props = g.props.filter(p => P.properties[p]);   // a property may have left the workbook
  if (!props.length) { alert(`None of the properties in "${g.name}" are in the current report.`); return; }
  setInclude(props.length === allProps().length ? null : props, g.name);
  writeHash(); syncSelector(); draw();
  $("filterPanel").hidden = true;
}

/* ============================ routing ============================ */
function writeHash() {
  const parts = [];
  if (VIEW.type === "property") parts.push(encodeURIComponent(VIEW.label));
  else if (isFiltered()) parts.push("g=" + includedProps().map(encodeURIComponent).join(","));
  if (mFiltered()) parts.push("m=" + MSEL[0] + "-" + MSEL[1]);
  const h = parts.join("&");
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}
function readHash() {
  const all = location.hash.slice(1).split("&");
  const last = P.months.length - 1;
  MSEL = mAll();
  const mPart = all.find(p => p.startsWith("m="));
  if (mPart) {
    const [a, b] = mPart.slice(2).split("-").map(Number);
    if (Number.isInteger(a) && Number.isInteger(b) && a >= 0 && b <= last && a <= b) MSEL = [a, b];
  }
  const raw = all.find(p => !p.startsWith("m=")) || "";
  if (!raw) { setInclude(null, "Portfolio"); return; }
  if (raw.startsWith("g=")) {
    const props = raw.slice(2).split(",").map(decodeURIComponent).filter(p => P.properties[p]);
    if (props.length) {
      const named = GROUPS.find(g => g.props.length === props.length && g.props.every(p => props.includes(p)));
      const ent = Object.keys(P.entities).find(e =>
        P.entities[e].length === props.length && P.entities[e].every(p => props.includes(p)));
      setInclude(props, named ? named.name : ent || "Custom selection");
      return;
    }
  }
  const name = decodeURIComponent(raw);
  if (P.properties[name]) { VIEW.type = "property"; VIEW.label = name; VIEW.include = null; return; }
  setInclude(null, "Portfolio");
}

function syncSelector() {
  const sel = $("propSel");
  let html = `<option value="__ALL__">Portfolio — all properties</option>`;
  if (GROUPS.length) {
    html += `<optgroup label="Saved groups">` + GROUPS.map(g =>
      `<option value="__g:${esc(g.id)}">${esc(g.name)} (${g.props.length})</option>`).join("") + `</optgroup>`;
  }
  const ents = Object.keys(P.entities).filter(e => P.entities[e].length > 1);
  if (ents.length) {
    html += `<optgroup label="Entities">` + ents.map(e =>
      `<option value="__e:${esc(e)}">${esc(e)} (${P.entities[e].length})</option>`).join("") + `</optgroup>`;
  }
  for (const e in P.entities) {
    html += `<optgroup label="${esc(e)}">` +
      P.entities[e].map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("") + `</optgroup>`;
  }
  const grouped = new Set(Object.values(P.entities).flat());
  const loose = allProps().filter(p => !grouped.has(p));
  if (loose.length) html += `<optgroup label="Other">` +
    loose.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("") + `</optgroup>`;
  // Reflect the current view in the selector where one of its options matches it.
  let val = "__ALL__";
  if (VIEW.type === "property") val = VIEW.label;
  else if (isFiltered()) {
    const inc = includedProps();
    const g = GROUPS.find(x => x.props.length === inc.length && x.props.every(p => inc.includes(p)));
    const e = Object.keys(P.entities).find(x =>
      P.entities[x].length === inc.length && P.entities[x].every(p => inc.includes(p)));
    val = g ? "__g:" + g.id : e ? "__e:" + e : "__CUSTOM__";
    if (val === "__CUSTOM__") {
      html = `<option value="__CUSTOM__">Custom selection (${inc.length})</option>` + html;
    }
  }
  sel.innerHTML = html;
  sel.value = val;
}

function pick(v) {
  if (v === "__CUSTOM__") return;
  if (v === "__ALL__") setInclude(null, "Portfolio");
  else if (v.startsWith("__g:")) {
    const g = GROUPS.find(x => x.id === v.slice(4));
    if (g) return openGroup(g);
  } else if (v.startsWith("__e:")) {
    const e = v.slice(4);
    setInclude(P.entities[e] || [], e);
  } else if (P.properties[v]) {
    VIEW.type = "property"; VIEW.label = v; VIEW.include = null;
  }
  writeHash(); syncSelector(); draw();
  scrollTo({ top: 0, behavior: "smooth" });
}

function draw() {
  hideTip();
  updateFilterUI();
  $("monthRow").hidden = false;
  if (VIEW.type === "portfolio") renderPortfolio(); else renderProperty(VIEW.label);
}

/* ============================ app ============================ */
function boot() {
  initGroups();
  MSEL = mAll();
  GROUPS = loadGroups();
  readHash();
  renderMonths();
  syncSelector();
  $("propSel").addEventListener("change", e => pick(e.target.value));
  addEventListener("hashchange", () => { readHash(); syncSelector(); draw(); });

  $("foot").innerHTML =
    `Generated ${esc(META.generated)} from <b>${esc(META.source)}</b>, the consolidated profit &amp; loss prepared by the portfolio accountant. ` +
    `Figures follow that workbook as reported. Refreshed monthly. ` +
    `Saved groups are stored in this browser; share a view by copying the URL.`;

  const btn = $("themeBtn");
  if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
  const syncBtn = () => btn.textContent = document.documentElement.dataset.theme === "dark" ? "Light mode" : "Dark mode";
  syncBtn();
  btn.addEventListener("click", () => {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    syncBtn(); draw();
  });
  $("body").addEventListener("click", e => {
    const btn = e.target.closest("[data-download]");
    if (btn) downloadCSV(btn);
  });
  addEventListener("resize", hideTip);
  draw();
}
</script>
</body>
</html>
